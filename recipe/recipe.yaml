context:
  version: "1.5.2"
  build_number: 1

  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}
  library: ${{ "Library/" if not unix else "" }}

package:
  name: ocaml-csexp
  version: ${{ version }}

source:
  url: https://github.com/ocaml-dune/csexp/releases/download/${{ version }}/csexp-${{ version }}.tbz
  sha256: 1a14dd04bb4379a41990248550628c77913a9c07f3c35c1370b6960e697787ff

build:
  number: ${{ build_number }}
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
  script:
    - if: unix
      then:
        - dune build --profile=release -p csexp @install
        - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" csexp
      else:
        # Plain cmd.exe, not MSYS2 bash: pure OCaml, no stubs, so no wrapper is
        # needed and the backslashed install prefix reaches dune intact. The
        # dune cache trips over mixed path separators on windows.
        - dune build --cache=disabled --profile=release -p csexp @install
        - if errorlevel 1 exit 1
        - dune install --prefix="%LIBRARY_PREFIX%" --libdir="%LIBRARY_PREFIX%\lib\ocaml" csexp
        - if errorlevel 1 exit 1

requirements:
  build:
    - if: not unix and c_compiler == "gcc"
      then:
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ stdlib("c") }}
    - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    - if: build_platform != target_platform
      then:
        - ocaml ${{ ocaml_compiler_version }}.*
    - ocaml-dune >=3.4
  host:
    - ocaml ${{ ocaml_compiler_version }}.*
    - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    # The mingw (ucrt64) toolchain links api-ms-win-crt-*.dll. On vs2022 the
    # MSVC runtime run_exports bring ucrt into run; on gcc nothing does, and a
    # host-only ucrt still counts as overlinking.
    - if: not unix and c_compiler == "gcc"
      then:
        - ucrt
  run:
    - if: not unix and c_compiler == "gcc"
      then:
        - ucrt
  # The ocaml run_export carries no build-string glob, so it does not encode
  # the windows toolchain track; constrain it explicitly.
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} * ${{ c_compiler }}_*

tests:
  - package_contents:
      strict: true
      files:
        - ${{ library }}lib/ocaml/csexp/*
        - ${{ library }}doc/csexp/*

about:
  homepage: https://github.com/ocaml-dune/csexp
  repository: https://github.com/ocaml-dune/csexp
  summary: Parsing and printing of S-expressions in canonical form
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
